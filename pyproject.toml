[project]
name = "arrangement-analyzer"
version = "0.1.0"
description = "Interactive, locally-run analysis of how a finished record is arranged"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13",
    "soundfile>=0.12",
    "librosa==1.0.0",
    "torch>=2.6",
    "torchaudio>=2.6",
    "demucs==4.1.0",
    # Beat This remains the portable fallback when optional Apple Silicon MLX
    # inference is unavailable. Librosa is a final fallback in dsp/rhythm.py.
    "beat_this>=1.1.0",
    "pyloudnorm>=0.1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "requests>=2.32",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Apple Silicon-only structural model. The core package remains portable and
# falls back to Beat This + local structure detection when MLX is unavailable.
structure-mlx = ["all-in-one-mlx==1.0.14"]
# Optional audio-tagging backends. Not required: the pipeline degrades to
# measured-only descriptors when they are absent.
tagging = [
    "essentia==2.1b6.dev1389",
    "transformers>=4.44",
]

[project.scripts]
arrangement-server = "arrangement.server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/arrangement"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"backend/arrangement/llm/ground.py" = ["E731"]
